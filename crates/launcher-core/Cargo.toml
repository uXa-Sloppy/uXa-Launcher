[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
description = "Patching, release lookup, and launch planning for uXa Launcher"
authors.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tracing = "0.1"
zip = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
