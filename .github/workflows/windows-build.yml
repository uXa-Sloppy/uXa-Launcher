name: Windows build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Recent stable. Edition 2024 needs rustc 1.85 or newer; 1.99 is the
          # stable that already compiled this lockfile on the Windows runners.
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Test patching, launch planning, and the server agent
        run: cargo test -p launcher-core -p uxa-server-agent

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: npm ci
      - name: Test patching, launch planning, and the server agent
        run: cargo test -p launcher-core -p uxa-server-agent
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Build server agent
        run: cargo build -p uxa-server-agent --release
      - name: Stage release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = @(
            "target\release\uxa-launcher.exe",
            "src-tauri\target\release\uxa-launcher.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "uxa-launcher.exe was not produced" }
          Copy-Item $exe "release\uxa-launcher.exe"
          $setup = Get-ChildItem -Path "target\release\bundle\nsis\*.exe","src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          Copy-Item $setup.FullName (Join-Path "release" $setup.Name)
          Copy-Item "target\release\uxa-server-agent.exe" "release\uxa-server-agent.exe"
          $lines = foreach ($file in Get-ChildItem "release\*") {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            "{0}  {1}" -f $hash, $file.Name
          }
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) "release\SHA256SUMS.txt"), [string[]]$lines)
          Get-ChildItem release | ForEach-Object { Write-Host $_.Name }
          Get-Content "release\SHA256SUMS.txt"
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: uxa-launcher-windows
          path: release/*
          if-no-files-found: error
      - name: Upload server agent
        uses: actions/upload-artifact@v4
        with:
          name: uxa-server-agent-windows
          path: target/release/uxa-server-agent.exe
          if-no-files-found: error
      - name: Release tag
        id: rel
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $conf = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
            $tag = "v$($conf.version)"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "Refusing to publish release tag '$tag'" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ steps.rel.outputs.tag }}"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub release $tag" }
          }
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets for $tag" }
