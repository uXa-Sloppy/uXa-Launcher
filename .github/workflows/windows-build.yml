name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test patching, launch planning, and the server agent
        run: cargo test -p launcher-core -p uxa-server-agent

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: npm ci
      - name: Test patching, launch planning, and the server agent
        run: cargo test -p launcher-core -p uxa-server-agent
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Build server agent
        run: cargo build -p uxa-server-agent --release
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: uxa-launcher-windows
          # Cargo workspace target dir is the repo root, not src-tauri/target.
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload server agent
        uses: actions/upload-artifact@v4
        with:
          name: uxa-server-agent-windows
          path: target/release/uxa-server-agent.exe
          if-no-files-found: error
